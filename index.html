<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Web Space</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    header {
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    p.welcome-msg {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      background-color: var(--card-bg);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: var(--shadow);
      transition: all 0.2s ease-in-out;
      border: 1px solid #e2e8f0;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .link-card .arrow {
      font-size: 1.2rem;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Welcome to My Website</h1>
      <p class="welcome-msg">
        Hi there! 👋 Thanks for visiting. Explore the pages below to see what I've been working on.
      </p>
    </header>

    <main class="links-grid">
      <!-- Replace page1.html with your actual file name and title -->
      <a href="library game(v2).html" class="link-card">
        <span>Library Promotion</span>
        <span class="arrow">→</span>
      </a>

      <!-- Replace page2.html with your actual file name and title -->
      <a href="librarygame.html" class="link-card">
        <span>Page 2 Title</span>
        <span class="arrow">→</span>
      </a>

      <!-- Replace page3.html with your actual file name and title -->
      <a href="librarypromotion.html" class="link-card">
        <span>Page 3 Title</span>
        <span class="arrow">→</span>
      </a>

      <!-- Replace page4.html with your actual file name and title -->
      <a href="memory.html" class="link-card">
        <span>Page 4 Title</span>
        <span class="arrow">→</span>
      </a>
    </main>
    <footer>
      <p>&copy; Hosted on GitHub Pages</p>
    </footer>
  </div>

</body>
</html>
